name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all presentations
        run: |
          mkdir -p dist
          for dir in */; do
            name="${dir%/}"
            if [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-.+ ]] && [ -f "$name/slides.md" ]; then
              echo "Building: $name"
              npx slidev build "$name/slides.md" --base "/${{ github.event.repository.name }}/$name/" --out "dist/$name"
            fi
          done

      - name: Generate index page
        run: |
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Slidev Presentations</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.5rem; margin-bottom: 2rem; }
              ul { list-style: none; padding: 0; }
              li { margin: 0.75rem 0; }
              a { color: #3b82f6; text-decoration: none; font-size: 1rem; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Slidev Presentations</h1>
            <ul>
          EOF

          for dir in */; do
            name="${dir%/}"
            if [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-.+ ]] && [ -f "$name/slides.md" ]; then
              echo "      <li><a href=\"/${{ github.event.repository.name }}/$name/\">$name</a></li>" >> dist/index.html
            fi
          done

          cat >> dist/index.html << 'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
